<main class="about">
  <figure class="about-photo"><img src="content/소개.jpg" alt="클못 작업 공간"></figure>

<script>
// 모바일 메뉴 — 오른쪽 위 짝대기 두 개를 누르면 펼쳐진다 (2026-09-21 소장님 요청).
(function () {
  var b = document.getElementById('menu-btn'), n = document.querySelector('.head .nav');
  if (!b || !n) return;
  function set(on) {
    b.classList.toggle('on', on); n.classList.toggle('on', on);
    b.setAttribute('aria-expanded', on ? 'true' : 'false');
  }
  b.addEventListener('click', function () { set(!n.classList.contains('on')); });
  n.addEventListener('click', function (e) { if (e.target.tagName === 'A') set(false); });
  addEventListener('keydown', function (e) { if (e.key === 'Escape') set(false); });
})();
</script>
<script src="site.js"></script>
<script>
// 소개 글은 content/소개.csv 의 '문단' 칸을 위에서부터 한 단락씩 읽는다.
// 사진은 content/소개.jpg 를 바꿔 끼우면 된다.
DATA.text('소개.csv').then(function (rows) {
  document.getElementById('about-text').innerHTML =
    rows.map(function (r) { return '<p>' + DATA.esc(r['문단']) + '</p>'; }).join('');
}).catch(DATA.fail);
</script>
