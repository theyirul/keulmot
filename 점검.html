<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자료 점검 — 클못 clemot</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  body { background:#F5F2ED; color:#000; margin:0; padding:48px 24px 120px;
         font-family:Pretendard,-apple-system,system-ui,sans-serif; font-size:16px; line-height:1.7; }
  .box { max-width:760px; margin:0 auto; }
  h1 { font-size:24px; margin:0 0 8px; }
  p.lead { color:#8a857e; margin:0 0 32px; }
  h2 { font-size:18px; margin:32px 0 8px; padding-top:20px; border-top:1px solid #d7d2cb; }
  ul { margin:0; padding-left:20px; }
  li { margin:4px 0; }
  .ok { color:#1a7f37; }
  .bad { color:#b42318; font-weight:700; }
  .warn { color:#9a6700; }
  table { border-collapse:collapse; width:100%; font-size:15px; margin-top:8px; }
  th,td { text-align:left; padding:7px 10px; border-bottom:1px solid #e3ddd3; }
  th { color:#8a857e; font-weight:400; }
  .big { font-size:20px; padding:16px 20px; border-radius:2px; margin-bottom:8px; }
  .big.ok { background:#e8f3ec; }
  .big.bad { background:#fbeae8; }
</style>
</head>
<body>
<div class="box">
  <h1>자료 점검</h1>
  <p class="lead">content 폴더의 자료에 빠진 곳이 없는지 확인합니다. <b>파일을 올린 뒤</b> 이 페이지를 열어 보세요.</p>
  <div id="out">읽는 중…</div>
</div>

<script src="site.js"></script>
<script>
/* 사진 폴더는 브라우저가 목록을 볼 수 없다. 그래서 "있을 법한 이름" 을 여기 적어 두고 확인한다.
   사례를 지웠는데 폴더가 남아 있거나, 폴더만 만들고 엑셀에 안 적은 경우를 잡기 위한 것이다.
   새 사례를 만들 때 이 줄에 이름을 넣어 두면 점검이 더 꼼꼼해진다 (안 넣어도 사이트는 정상 동작). */
var EXTRA_FOLDERS = [];

/* content 폴더를 훑어 문제를 한국어로 짚어 준다.
   소장님이 파일을 고친 뒤 여기만 열어 보면 뭐가 잘못됐는지 바로 안다. */
var bad = [], warn = [], out = [];

DATA.all().then(function (d) {
  // 1. 사례 목록
  out.push('<h2>시공 사례 ' + d.cases.length + '건</h2><table><tr>' +
    '<th>이름</th><th>연도</th><th>유형</th><th>평형</th><th>사진</th><th>대표사진</th></tr>' +
    d.cases.map(function (c) {
      var miss = [];
      ['year','type','size'].forEach(function (k, i) {
        if (!c[k]) miss.push(['연도','유형','평형'][i]);
      });
      if (miss.length) bad.push(c.name + ' — ' + miss.join('·') + ' 칸이 비어 있습니다');
      if (!c.photos.length) bad.push(c.name + ' — 사진 폴더가 비었거나 이름이 다릅니다 (content/사진/' + c.name + ')');
      var leadOK = c.photos.indexOf(c.lead) >= 0;
      if (c.photos.length && !leadOK) bad.push(c.name + ' — 대표사진 "' + c.lead + '" 이 폴더에 없습니다');
      return '<tr><td>' + DATA.esc(c.name) + '</td><td>' + DATA.esc(c.year) + '</td><td>' +
        DATA.esc(c.type) + '</td><td>' + DATA.esc(c.size) + '</td><td>' + c.photos.length + '장</td><td class="' +
        (leadOK ? 'ok' : 'bad') + '">' + DATA.esc(c.lead) + '</td></tr>';
    }).join('') + '</table>');

  // 2. 메인 12자리
  var filled = {};
  d.main.forEach(function (m) { filled[m.slot] = m; });
  var rows = '';
  for (var n = 1; n <= 12; n++) {
    var m = filled[n];
    if (!m) { bad.push(n + '번 자리가 메인배치.csv 에 없습니다'); rows += '<tr><td>' + n + '</td><td class="bad" colspan="2">비어 있음</td></tr>'; continue; }
    var c = DATA.find(d, m.caseName);
    var okCase = !!c, okPhoto = okCase && c.photos.indexOf(m.photo) >= 0;
    if (!okCase) bad.push(n + '번 자리 — "' + m.caseName + '" 이 사례목록.csv 에 없습니다');
    else if (!okPhoto) bad.push(n + '번 자리 — ' + m.caseName + ' 폴더에 "' + m.photo + '" 이 없습니다');
    rows += '<tr><td>' + n + '</td><td class="' + (okCase ? '' : 'bad') + '">' + DATA.esc(m.caseName) +
            '</td><td class="' + (okPhoto ? 'ok' : 'bad') + '">' + DATA.esc(m.photo) + '</td></tr>';
  }
  out.push('<h2>메인 12자리</h2><table><tr><th>자리</th><th>사례</th><th>사진</th></tr>' + rows + '</table>');

  // 3. 문의
  out.push('<h2>문의 ' + d.contact.length + '줄</h2><table><tr><th>항목</th><th>내용</th><th>링크</th></tr>' +
    d.contact.map(function (x) {
      if (!x.value) warn.push(x.label + ' — 내용이 비어 있습니다');
      return '<tr><td>' + DATA.esc(x.label) + '</td><td>' + DATA.esc(x.value) +
             '</td><td>' + (x.link ? '있음' : '—') + '</td></tr>';
    }).join('') + '</table>');

  // 4. 목록에 없는 사진 폴더 — 사례를 추가하다 CSV 한 줄을 빠뜨린 경우를 잡는다.
  //    폴더 목록을 직접 볼 수는 없으니, 사이트가 폴더 이름을 적어 둔 곳(아래 후보)만 확인한다.
  var known = {};
  d.cases.forEach(function (c) { known[c.name] = 1; });
  d.main.forEach(function (m) {
    if (!known[m.caseName]) return;   // 이미 위에서 잡았다
  });
  var orphanCheck = Promise.all(EXTRA_FOLDERS.filter(function (f) { return !known[f]; })
    .map(function (f) {
      return DATA.exists('content/사진/' + f + '/01.jpg').then(function (ok) {
        if (ok) bad.push('"' + f + '" 폴더에 사진이 있는데 사례목록.csv 에 그 줄이 없습니다 — 엑셀에 한 줄 추가해 주세요');
      });
    }));

  // 5. 쓰이지 않는 사진
  var used = {};
  d.main.forEach(function (m) { used[m.caseName + '/' + m.photo] = 1; });
  var never = d.cases.filter(function (c) {
    return !d.main.some(function (m) { return m.caseName === c.name; });
  });
  if (never.length) warn.push('메인에 한 번도 안 나오는 사례: ' + never.map(function (c) { return c.name; }).join(', '));


  orphanCheck.then(function () {
    var head2 = bad.length
      ? '<div class="big bad">고쳐야 할 곳이 ' + bad.length + '군데 있습니다</div><ul>' +
        bad.map(function (m) { return '<li class="bad">' + DATA.esc(m) + '</li>'; }).join('') + '</ul>'
      : '<div class="big ok">문제 없습니다. 그대로 올리시면 됩니다</div>';
    if (warn.length) head2 += '<ul>' + warn.map(function (m) { return '<li class="warn">참고 — ' + DATA.esc(m) + '</li>'; }).join('') + '</ul>';
    document.getElementById('out').innerHTML = head2 + out.join('');
  });
}).catch(function (e) {
  document.getElementById('out').innerHTML =
    '<div class="big bad">자료를 못 읽었습니다</div><p>' + DATA.why(e) + '</p>';
});
</script>
</body>
</html>
