<script src="site.js"></script>
<script>
/* 사례 한 건 — 주소의 ?id= 로 어느 집인지 정한다.
   맨 위는 대표 사진 + 오른쪽 정보, 그 아래로 나머지 컷이 이어진다.
   메인에서 특정 사진을 눌러 들어오면 주소 끝의 #09 를 보고 그 사진이 대표가 된다. */
(function () {
  var id = new URLSearchParams(location.search).get('id') || '';
  var want = decodeURIComponent(location.hash.replace('#', ''));

  DATA.all().then(function (d) {
    var c = DATA.find(d, id) || d.cases[0];
    if (!c) throw new Error('사례목록.csv 에 사례가 한 건도 없습니다');

    var lead = c.lead;
    if (want && c.photos.indexOf(want + '.jpg') >= 0) lead = want + '.jpg';
    if (c.photos.indexOf(lead) < 0) lead = c.photos[0];
    var rest = c.photos.filter(function (f) { return f !== lead; });
    var n = DATA.esc(c.name);
    function src(f) { return DATA.url('content/사진/' + c.name + '/' + f); }

    document.title = c.name + ' — 클못 clemot';
    document.getElementById('case').innerHTML =
      '<div class="case-lead">' +
        '<figure><img src="' + src(lead) + '" alt="' + n + ' 시공 사진"></figure>' +
        '<div class="case-meta"><p>' + DATA.esc(c.year) + '</p><p>' + DATA.esc(c.type) +
          '</p><p>' + n + '</p><p>' + DATA.esc(c.size) + '</p></div>' +
      '</div>' +
      '<div class="case-imgs">' + rest.map(function (f) {
        return '<img src="' + src(f) + '" alt="' + n + ' 시공 사진" loading="lazy">';
      }).join('') + '</div>';
  }).catch(DATA.fail);

  /* 아래 '← 시공사례' 는 글자 그대로 시공사례 목록으로 간다.
     예전엔 뒤로가기로 가로챘는데, 메인에서 들어온 경우 메인으로 돌아가 버려서 뺐다.
     보던 자리로 돌아가고 싶으면 ESC 나 브라우저 뒤로가기를 쓰면 된다. */
  addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    var inSite = document.referrer && document.referrer.indexOf(location.origin) === 0;
    if (inSite) history.back(); else location.href = 'works.html';
  });
})();
</script>

</body>
