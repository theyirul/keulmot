<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시공사례 — 클못 clemot</title>
<meta name="description" content="1인 인테리어 스튜디오 클못의 주거 공간 시공사례. 상담부터 시공까지 대표가 직접 합니다.">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="style.css">
<style>
/* 토큰·고정 바·라이트박스는 style.css 에 있다. 여기에는 이 페이지만의 목록 레이아웃만 둔다.
 *
 * 메인(index.html)은 사진을 좌우로 흩뿌리지만, 이 목록은 균일한 3열 그리드다.
 * 찾아보는 화면이라 "몇 건이 있고 어떤 집이었나"가 한눈에 들어오는 쪽이 낫다.
 * 메인과 달리 화면을 고정하지 않고 평범하게 스크롤한다. */
.list {
  padding: var(--top) var(--side) 120px;
  display: grid; grid-template-columns: repeat(3, 1fr);
  column-gap: var(--gap); row-gap: 72px;
}

.item { cursor: pointer; }
.item:hover img { opacity: .72; }
.item:hover .meta { opacity: .5; }

/* 사진은 정사각으로 잘라 넣는다. 원본이 3:4 와 1:1 로 섞여 있어서, 그대로 두면
   줄마다 높이가 널뛴다. 1:1 이면 정사각 컷은 그대로, 3:4 컷은 위아래만 깎인다. */
.item img {
  width: 100%; aspect-ratio: 1; object-fit: cover; object-position: center;
  background: var(--ph); transition: opacity .25s;
}

/* 캡션은 사진 바로 아래. 왼쪽 칸에 연도만 두고, 오른쪽 칸에 유형·이름·평형을 세 줄로 쌓는다.
   연도 열이 왼쪽에 반듯하게 서고 나머지가 한 줄에 맞춰 들어오는 형태. */
.meta {
  margin-top: 14px;
  display: grid; grid-template-columns: 4.2em 1fr auto;
  align-items: start; gap: 5px 8px;
  font-size: var(--fs-meta); transition: opacity .25s;
}
.meta .yr { grid-column: 1; grid-row: 1; }
.meta .ty { grid-column: 2; grid-row: 1; }
.meta .nm { grid-column: 2; grid-row: 2; }
.meta .sz { grid-column: 2; grid-row: 3; }
.meta .ar { grid-column: 3; grid-row: 1; }

@media (max-width: 767px) {
  .list { grid-template-columns: 1fr; row-gap: 56px; }
  .meta { grid-template-columns: 3.8em 1fr auto; }   /* 크기는 PC와 같은 14px */
}

/* 태블릿 — 3열은 좁고 1열은 허전한 구간 */
@media (min-width: 768px) and (max-width: 1023px) {
  .list { grid-template-columns: repeat(2, 1fr); row-gap: 64px; }
}
</style>
</head>
<body>
