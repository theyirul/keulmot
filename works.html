<header class="head">
  <a class="b1" href="index.html">클못</a>

  <nav class="nav">
    <a href="works.html" aria-current="page">시공사례</a>
    <a href="contact.html">문의</a>
  </nav>
</header>

<main class="list" id="list"></main>

<script src="site.js"></script>
<script>
// 시공사례 목록 — content/사례목록.csv 에 적힌 순서 그대로 늘어놓는다.
DATA.all().then(function (d) {
  document.getElementById('list').innerHTML = d.cases.map(function (c) {
    var n = DATA.esc(c.name);
    return '<a class="item" href="case.html?id=' + encodeURIComponent(c.name) + '">' +
      '<img src="' + DATA.url('content/사진/' + c.name + '/' + c.lead) +
        '" alt="' + n + ' 시공 사진" loading="lazy">' +
      '<div class="meta">' +
        '<span class="yr">' + DATA.esc(c.year) + '</span>' +
        '<span class="ty">' + DATA.esc(c.type) + '</span>' +
        '<span class="ar" aria-hidden="true">&rarr;</span>' +
        '<span class="nm">' + n + '</span>' +
        '<span class="sz">' + DATA.esc(c.size) + '</span>' +
      '</div></a>';
  }).join('');
}).catch(DATA.fail);
</script>

</body>
