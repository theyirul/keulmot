<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>상담 신청 — 클못 KEULMOT</title>
<meta name="description" content="클못 시공 상담 신청. 상담부터 시공까지 대표가 직접 합니다. 편하게 문의 남겨주세요.">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{--maxw:1240px;--photo:#ebebeb}
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:#fff;color:#000;
    font-family:"Helvetica Neue",Arial,Pretendard,-apple-system,system-ui,sans-serif;
    font-size:14px;line-height:1.65;letter-spacing:-.005em;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 clamp(20px,4vw,40px)}
  a{color:inherit;text-decoration:none}
  a:hover{opacity:.55}

  /* 상호명 — 메인과 동일하게 fixed. 스크롤을 따라온다. */
  .brand{position:fixed;top:20px;left:clamp(16px,3vw,32px);z-index:60;
    font-size:16px;font-weight:700;letter-spacing:.04em;mix-blend-mode:difference;color:#fff}
  .brand small{font-weight:400;letter-spacing:.12em;margin-left:7px}
  @media(max-width:480px){
    .brand{top:14px;font-size:14px}
    .brand small{display:none}
  }

  /* 레이아웃 — 메인과 동일한 단일 컬럼 에디토리얼 톤 */
  .layout{max-width:600px;padding:clamp(96px,13vw,150px) 0 clamp(52px,7vw,84px)}

  /* 안내 — 업체 소개는 두지 않는다(2026-08-14 소장님 요청). 폼 이용 안내 한 줄만. */
  .intro{margin-bottom:clamp(32px,5vw,48px)}
  .intro .note{font-size:12px;line-height:1.7;color:#999;max-width:26em}

  /* 폼 */
  .form-head{font-size:16px;font-weight:700;letter-spacing:.02em;padding-bottom:14px;border-bottom:1px solid #000;margin-bottom:32px}
  .field{margin-bottom:30px}
  .field label{display:block;font-size:14px;font-weight:700;margin-bottom:10px}
  .field label .req{color:#000;margin-left:3px}
  .field input,.field select,.field textarea{
    width:100%;border:0;border-bottom:1px solid #cfcfcf;background:transparent;
    font:inherit;color:#000;padding:8px 2px;outline:none;
  }
  .field input::placeholder,.field textarea::placeholder{color:#b3b3b3}
  .field input:focus,.field select:focus,.field textarea:focus{border-bottom-color:#000}
  .field select{appearance:none;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='black' fill='none' stroke-width='1.4'/></svg>") no-repeat right 2px center;color:#777}
  .field select:valid{color:#000}
  .field textarea{resize:vertical;min-height:80px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:24px}
  @media(max-width:480px){.two{grid-template-columns:1fr}}

  .agree{margin:36px 0 8px;padding-top:28px}
  .agree label{display:flex;align-items:flex-start;gap:10px;font-size:14px;color:#555;cursor:pointer;margin-bottom:12px}
  .agree label.main{font-size:14px;font-weight:700;color:#000}
  .agree input{margin-top:3px;flex:0 0 auto;accent-color:#000}
  .agree u{text-underline-offset:2px}

  .submit{display:inline-block;margin-top:32px;background:transparent;color:#000;
    border:1px solid #000;padding:13px 32px;font:inherit;font-weight:700;font-size:14px;letter-spacing:.02em;
    cursor:pointer;transition:background .2s,color .2s}
  .submit:hover{background:#000;color:#fff}

  footer{padding:28px 0;font-size:12px;color:#aaa;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
  footer a{color:#000}
</style>
</head>
<body>

<a class="brand" href="index.html">클못<small>KEULMOT</small></a>

<div class="wrap">
  <div class="layout">

    <!-- 안내 -->
    <div class="intro">
      <p class="note">현장에 있을 경우에는 답변이 늦어질 수 있습니다.</p>
    </div>

    <!-- 폼 -->
    <form onsubmit="return false">
      <div class="form-head">신청서 작성</div>

      <div class="two">
        <div class="field">
          <label>이름 <span class="req">*</span></label>
          <input type="text" placeholder="성함을 입력해주세요" required>
        </div>
        <div class="field">
          <label>연락처 <span class="req">*</span></label>
          <input type="tel" placeholder="연락 가능한 번호" required>
        </div>
      </div>

      <div class="field">
        <label>시공 예정 주소 <span class="req">*</span></label>
        <input type="text" placeholder="시공하려는 아파트 주소를 알려주세요" required>
      </div>

      <div class="two">
        <div class="field">
          <label>평형</label>
          <input type="text" placeholder="예) 24평">
        </div>
        <div class="field">
          <label>예상 예산</label>
          <select required>
            <option value="" disabled selected>선택하세요</option>
            <option>2천만원 이하</option>
            <option>2~4천만원</option>
            <option>4~6천만원</option>
            <option>6천만원 이상</option>
            <option>상담 후 결정</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label>예상 공사 시기</label>
        <select required>
          <option value="" disabled selected>선택하세요</option>
          <option>1개월 이내</option>
          <option>1~3개월</option>
          <option>3개월 이후</option>
          <option>미정</option>
        </select>
      </div>

      <div class="field">
        <label>문의 내용</label>
        <textarea placeholder="원하시는 분위기, 참고 이미지, 궁금한 점을 자유롭게 적어주세요"></textarea>
      </div>

      <div class="agree">
        <label class="main"><input type="checkbox" id="all"> 약관에 모두 동의합니다</label>
        <label><input type="checkbox" class="sub-agree"> 상담을 위한 <u>개인정보 수집·이용 동의</u> (필수)</label>
        <label><input type="checkbox" class="sub-agree"> 안내·소식 수신 동의 (선택)</label>
      </div>

      <button type="submit" class="submit">상담 신청하기</button>
    </form>

  </div>
</div>

<div class="wrap">
  <footer>
    <span>클못 KEULMOT — 대표 김태연</span>
    <!-- 카카오톡 채널 URL이 오면 여기를 그 링크로 교체하고 라벨을 "카카오톡 문의"로 -->
    <a href="index.html">시공 사례</a>
    <span>© 2026 KEULMOT</span>
  </footer>
</div>

<script>
  // 약관 전체동의 토글
  var all=document.getElementById('all');
  var subs=document.querySelectorAll('.sub-agree');
  all.addEventListener('change',function(){subs.forEach(function(c){c.checked=all.checked});});
</script>

</body>
</html>
