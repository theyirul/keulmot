<script>
/* 문의 — content/문의.csv 의 줄을 그대로 늘어놓는다.
   링크 칸이 비어 있으면 그냥 글자로, 차 있으면 누를 수 있게 된다.
   링크글자 칸이 있으면 값 옆에 그 글자로 따로 링크가 붙는다 (예: 주소 옆 '지도보기'). */
DATA.all().then(function (d) {
  document.getElementById('rows').innerHTML = d.contact.map(function (x) {
    var v = DATA.esc(x.value), body;
    if (x.link && x.linkText) {
      body = v + '<a class="map" href="' + DATA.esc(x.link) + '" target="_blank" rel="noopener">' +
             DATA.esc(x.linkText) + '</a>';
    } else if (x.link) {
      var cls = /^https?:/.test(x.link) ? ' class="link"' : '';
      var tgt = /^https?:/.test(x.link) ? ' target="_blank" rel="noopener"' : '';
      body = '<a' + cls + ' href="' + DATA.esc(x.link) + '"' + tgt + '>' + v + '</a>';
    } else {
      body = '<span class="todo">' + v + '</span>';
    }
    return '<div class="row"><dt>' + DATA.esc(x.label) + '</dt><dd>' + body + '</dd></div>';
  }).join('');
}).catch(DATA.fail);
</script>

</body>
