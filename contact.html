<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>상담 신청 — 클못 CLEMOT</title>
<meta name="description" content="클못 시공 상담 신청. 상담부터 시공까지 대표가 직접 합니다. 편하게 문의 남겨주세요.">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="style.css">
<style>
  /* 메인과 공통인 것(글꼴·색·상호명·푸터·여백 변수)은 style.css 에 있다.
     여기에는 이 페이지에만 있는 폼 스타일만 둔다.
     글자 크기를 바꾸려면 style.css 의 :root 나 조절기(/__tune)를 쓸 것. */
  .wrap{max-width:1240px;margin:0 auto;padding:0 var(--side)}
  .layout{max-width:var(--form-maxw);padding:clamp(92px,12vw,140px) 0 clamp(52px,7vw,84px)}

  /* 헤더는 메인처럼 고정한다.
     다만 메인은 사진 위를 지나가며 반전(mix-blend-mode)으로 읽히는데,
     이 페이지는 글자 위에 글자가 겹쳐 둘 다 못 읽게 된다.
     그래서 반전을 끄고 흰 배경을 깔아, 폼이 헤더 아래로 지나가며 가려지게 한다.
     배경이 어차피 흰색이라 메인과 보이는 결과는 같다. */
  .page-head{
    position:fixed;top:0;left:0;right:0;z-index:60;
    display:flex;justify-content:space-between;align-items:baseline;
    padding:var(--top) var(--side);
    background:#fff;
  }
  .page-head .brand,.page-head .nav{
    position:static;mix-blend-mode:normal;color:var(--ink);
  }

  /* 업체 소개도, 폼 제목도, 안내 문구도 두지 않는다(2026-08-14). 입력 항목만 남긴다. */

  .field{margin-bottom:var(--field-gap)}
  .field label{display:block;font-size:var(--fs-label);font-weight:700;margin-bottom:10px}
  .field label .req{color:#000;margin-left:3px}
  .field input,.field select,.field textarea{
    width:100%;border:0;border-bottom:1px solid #cfcfcf;background:transparent;
    font:inherit;font-size:var(--fs-input);color:#000;padding:8px 2px;outline:none;
  }
  .field input::placeholder,.field textarea::placeholder{color:#b3b3b3}
  .field input:focus,.field select:focus,.field textarea:focus{border-bottom-color:#000}
  .field select{appearance:none;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='black' fill='none' stroke-width='1.4'/></svg>") no-repeat right 2px center;color:#777}
  .field select:valid{color:#000}
  .field textarea{resize:vertical;min-height:80px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:var(--field-gap)}
  @media(max-width:480px){.two{grid-template-columns:1fr}}

  .agree{margin:36px 0 8px;padding-top:28px}
  .agree label{display:flex;align-items:flex-start;gap:10px;font-size:var(--fs-input);color:#555;cursor:pointer;margin-bottom:12px}
  .agree label.main{font-size:var(--fs-input);font-weight:700;color:#000}
  .agree input{margin-top:3px;flex:0 0 auto;accent-color:#000}
  .agree u{text-underline-offset:2px}

  .submit{display:inline-block;margin-top:36px;background:transparent;color:#000;
    border:0;padding:0;font:inherit;font-weight:700;font-size:var(--fs-submit);letter-spacing:.01em;
    text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:1px;
    cursor:pointer;transition:opacity .2s}
  .submit:hover{opacity:.5}
</style>
</head>
<body>

<header class="page-head">
  <a class="brand" href="index.html">클못<small>CLEMOT</small></a>
  <nav class="nav"><a href="index.html">홈</a></nav>
</header>

<div class="wrap">
  <div class="layout">

    <!-- 폼 -->
    <form onsubmit="return false">
      <div class="two">
        <div class="field">
          <label>이름 <span class="req">*</span></label>
          <input type="text" placeholder="성함을 입력해주세요" required>
        </div>
        <div class="field">
          <label>연락처 <span class="req">*</span></label>
          <input type="tel" placeholder="연락 가능한 번호" required>
        </div>
      </div>

      <div class="field">
        <label>시공 예정 주소 <span class="req">*</span></label>
        <input type="text" placeholder="시공하려는 아파트 주소를 알려주세요" required>
      </div>

      <div class="two">
        <div class="field">
          <label>평형</label>
          <input type="text" placeholder="예) 24평">
        </div>
        <div class="field">
          <label>예상 예산</label>
          <select required>
            <option value="" disabled selected>선택하세요</option>
            <option>2천만원 이하</option>
            <option>2~4천만원</option>
            <option>4~6천만원</option>
            <option>6천만원 이상</option>
            <option>상담 후 결정</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label>예상 공사 시기</label>
        <select required>
          <option value="" disabled selected>선택하세요</option>
          <option>1개월 이내</option>
          <option>1~3개월</option>
          <option>3개월 이후</option>
          <option>미정</option>
        </select>
      </div>

      <div class="field">
        <label>문의 내용</label>
        <textarea placeholder="원하시는 분위기, 참고 이미지, 궁금한 점을 자유롭게 적어주세요"></textarea>
      </div>

      <div class="agree">
        <label class="main"><input type="checkbox" id="all"> 약관에 모두 동의합니다</label>
        <label><input type="checkbox" class="sub-agree"> 상담을 위한 <u>개인정보 수집·이용 동의</u> (필수)</label>
        <label><input type="checkbox" class="sub-agree"> 안내·소식 수신 동의 (선택)</label>
      </div>

      <button type="submit" class="submit">상담 신청하기</button>
    </form>

  </div>
</div>

<footer>
  <div class="links">
    <a href="index.html">홈</a>
    <span class="sep">|</span>
    <!-- 카카오톡 채널 URL이 오면 여기를 그 링크로 교체하고 라벨을 "카카오톡 문의하기"로 -->
    <a href="contact.html">문의하기</a>
  </div>
  <small>© 2026 CLEMOT All rights reserved.</small>
</footer>

<script>
  // 약관 전체동의 토글
  var all=document.getElementById('all');
  var subs=document.querySelectorAll('.sub-agree');
  all.addEventListener('change',function(){subs.forEach(function(c){c.checked=all.checked});});
</script>

</body>
</html>
