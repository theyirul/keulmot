<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="style.css">
<style>
/* 토큰·고정 바는 style.css 에 있다. 여기에는 이 페이지만의 연락처 레이아웃만 둔다.
 *
 * 상담 신청 폼은 뺐다 (2026-09-18). 받는 곳도 없었고, 실제로 닿는 창구는 연락처다.
 * 내용이 안내 한 문장 + 연락처 다섯 줄뿐이라 PC에서는 화면 한가운데에 놓는다.
 * 위아래 고정 바 높이만큼만 비워 두면 그 사이의 정중앙에 앉는다.
 * 덩어리는 가운데지만 글은 왼쪽 정렬이다 — 라벨과 값의 세로줄이 맞아야 읽힌다. */
.wrap {
  display: grid; grid-template-columns: repeat(12, 1fr); gap: 0 var(--gap);
  padding: var(--head) var(--side);
  min-height: 100vh; align-content: center;
}
.sec { grid-column: 1/13; width: 100%; max-width: 520px; margin: 0 auto; }

.lead { font-size: var(--fs-caption); line-height: 1.6; margin-bottom: 56px; }

/* 연락처 — 라벨은 작고 흐리게, 값은 캡션 크기로. 값이 주인공이다 */
.rows { border-top: 1px solid var(--line); }
.row {
  display: grid; grid-template-columns: 88px 1fr; gap: 0 var(--gap);
  align-items: baseline;
  padding: 16px 0; border-bottom: 1px solid var(--line);
}
.row dt { font-size: var(--fs-meta); color: var(--mute); }
.row dd { font-size: var(--fs-caption); }
.row dd a:hover { opacity: .5; }
.row dd a.link { text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; }
.row dd.todo { color: var(--mute); }   /* 아직 값을 못 받은 줄 */

@media (max-width: 767px) {
  /* 모바일은 가운데 정렬을 풀고 위에서부터 읽게 둔다 — 화면이 좁아 가운데 둘 여유가 없다 */
  .wrap { align-content: start; padding: var(--top) var(--side) calc(var(--head) + 80px); }
  .sec { max-width: none; margin: 0; }
  .lead { font-size: calc(var(--fs-caption) * var(--fs-mo)); margin-bottom: 40px; }
  .row { grid-template-columns: 76px 1fr; }
  .row dd { font-size: calc(var(--fs-caption) * var(--fs-mo)); }
}
</style>
</head>
<body>
