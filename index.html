<script src="site.js"></script>
<script>
/* 메인 — content/메인배치.csv 가 정한 12자리에 사진을 올리고, 저절로 흐르게 한다.
   자리마다의 칼럼·캡션 위치·여백은 style.css 에 고정돼 있다(AKV 실측값).
   여기서는 "어느 사진이 어느 자리에" 만 자료에서 읽는다. */
(function () {
  var SPEED = 26;      // 저절로 흐르는 속도 (px/초)
  var EASE = 0.085;    // 따라붙는 부드러움
  var RESUME = 2500;   // 손댄 뒤 자동 흐름 재개까지 (ms)

  var track = document.getElementById('track');

  DATA.all().then(function (d) {
    var html = '', half = '';
    d.main.forEach(function (m) {
      var c = DATA.find(d, m.caseName);
      if (!c) return;
      var name = DATA.esc(c.name);
      var href = 'case.html?id=' + encodeURIComponent(c.name) +
                 '#' + encodeURIComponent(m.photo.replace(/\.jpg$/i, ''));
      var src = DATA.url('content/사진/' + c.name + '/' + m.photo);
      var lazy = m.slot > 2 ? ' loading="lazy"' : '';
      var blk =
        '<div class="blk' + (m.slot >= 11 ? ' half' : '') + '" data-b="' + m.slot + '">' +
          '<a class="ph" href="' + href + '" aria-label="' + name + ' 시공 사례">' +
            '<img src="' + src + '" alt="' + name + ' 시공 사진"' + lazy + '>' +
          '</a>' +
          '<a class="cap" href="' + href + '">' +
            '<span>' + name + '</span><span>' + DATA.esc(c.year) + '</span></a>' +
        '</div>';
      if (m.slot >= 11) half += blk; else html += blk;
    });
    if (half) html += '<div class="halfwrap">' + half + '</div>';

    // 같은 묶음을 두 벌 넣어 두고, 한 벌만큼 밀리면 제자리로 되돌린다 → 끊김 없이 이어진다
    track.innerHTML = '<div class="set" id="set">' + html + '</div>' +
                      '<div class="set" aria-hidden="true">' + html + '</div>';
    flow(document.getElementById('set'));
  }).catch(DATA.fail);

  function flow(set) {
    var setH = 0, target = 0, cur = 0, touchedAt = 0, hovering = false;
    var still = matchMedia('(prefers-reduced-motion:reduce)').matches;

    function measure() { setH = set.offsetHeight; }
    measure();
    addEventListener('resize', measure);
    set.querySelectorAll('img').forEach(function (im) {
      if (!im.complete) im.addEventListener('load', measure);
    });

    function touched() { touchedAt = Date.now(); }

    // 화면 전체가 fixed 라 기본 스크롤이 없다. 휠·손가락·키를 직접 받는다.
    addEventListener('wheel', function (e) {
      e.preventDefault(); target += e.deltaY; touched();
    }, { passive: false });

    var lastY = null;
    addEventListener('touchstart', function (e) { lastY = e.touches[0].clientY; touched(); }, { passive: true });
    addEventListener('touchmove', function (e) {
      if (lastY === null) return;
      var y = e.touches[0].clientY;
      target += (lastY - y) * 1.4; lastY = y; touched();
    }, { passive: true });
    addEventListener('touchend', function () { lastY = null; });

    addEventListener('keydown', function (e) {
      var step = innerHeight * .8;
      if (e.key === 'ArrowDown' || e.key === 'PageDown') { target += step; touched(); }
      if (e.key === 'ArrowUp' || e.key === 'PageUp') { target -= step; touched(); }
    });

    // 사진에 마우스를 올리면 멈춘다 — 보려는 사람을 흘려보내지 않으려고
    document.querySelectorAll('.blk').forEach(function (el) {
      el.addEventListener('mouseenter', function () { hovering = true; });
      el.addEventListener('mouseleave', function () { hovering = false; });
    });

    var prev = performance.now();
    (function frame(now) {
      var dt = Math.min(now - prev, 50) / 1000; prev = now;
      if (!still && Date.now() - touchedAt > RESUME && !hovering) target += SPEED * dt;
      cur += (target - cur) * EASE;
      if (setH > 0) {
        while (cur >= setH) { cur -= setH; target -= setH; }
        while (cur < 0) { cur += setH; target += setH; }
      }
      track.style.transform = 'translate3d(0,' + (-cur).toFixed(2) + 'px,0)';
      requestAnimationFrame(frame);
    })(performance.now());
  }
})();
</script>

</body>
