<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>클못 KEULMOT</title>
<meta name="description" content="1인 인테리어 스튜디오 클못의 주거 공간 시공 사례.">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:#fff;color:#000;
    font-family:"Helvetica Neue",Arial,Pretendard,-apple-system,system-ui,sans-serif;
    font-size:14px;line-height:1.6;letter-spacing:-.005em;
    -webkit-font-smoothing:antialiased;overflow-x:hidden;
  }
  img{max-width:100%;display:block}
  a{color:inherit;text-decoration:none}
  a:hover{opacity:.5}

  /* 상호명·메뉴 — fixed. PC·모바일 모두 스크롤을 따라온다. */
  .brand,.nav{position:fixed;top:20px;z-index:60;font-size:16px;font-weight:700;letter-spacing:.04em;mix-blend-mode:difference;color:#fff}
  .brand{left:clamp(16px,3vw,32px)}
  .nav{right:clamp(16px,3vw,32px);font-weight:400;letter-spacing:.02em}
  .brand small{font-weight:400;letter-spacing:.12em;margin-left:7px}
  @media(max-width:480px){
    .brand,.nav{top:14px;font-size:14px}
    .brand small{display:none}
  }

  /* 사진 흐름 — 좌우 두 칼럼. 좌측이 큰 덩어리, 우측이 작은 덩어리.
     칼럼 안에서 폭·offset이 사진마다 달라 "가상의 선"은 모호하게 읽히지만,
     행 높이는 grid가 잡아주므로 사진끼리 겹치지 않는다.
     좌우는 각자 스크롤하지 않고 늘 함께 내려간다(sticky 없음). */
  main{padding:clamp(110px,13vw,210px) 0 clamp(80px,9vw,150px)}
  /* 트랙은 fr가 아니라 확정 폭(%)으로 잡는다. fr 트랙 안에서 자식 폭을 %로 주면
     "트랙 폭 → 자식 폭 → 트랙 폭" 순환이 생겨 왼쪽 트랙이 제멋대로 넓어지고,
     좁은 화면에서 우측 보조사진이 화면 밖으로 밀려 잘린다. */
  .pair{
    display:grid;grid-template-columns:60% 40%;align-items:start;
    margin-bottom:clamp(70px,11vw,180px);cursor:pointer;
  }
  .pair:last-child{margin-bottom:0}
  .lead,.sub{min-width:0}
  .lead{position:relative;width:var(--lw);margin-left:var(--lm)}
  .sub{width:var(--sw);margin-left:var(--sm);margin-top:var(--st)}
  .pair img{background:#ebebeb;transition:opacity .25s}
  .pair:hover img{opacity:.72}
  .pair[data-set="geumho"]{--lw:48%;--lm:12%;--sw:38%;--sm:35%;--st:10vw}
  .pair[data-set="dmc"]{--lw:43%;--lm:25%;--sw:35%;--sm:22%;--st:4vw}
  .pair[data-set="magok"]{--lw:65%;--lm:8%;--sw:38%;--sm:40%;--st:16vw}
  .pair[data-set="manhyeon"]{--lw:60%;--lm:18%;--sw:38%;--sm:25%;--st:8vw}
  .pair[data-set="yeomchang"]{--lw:62%;--lm:10%;--sw:45%;--sm:30%;--st:12vw}

  /* 캡션 = 대표사진 아래선에 baseline을 맞춘 유일한 기준점 */
  .lead figcaption{
    position:absolute;left:calc(100% + 1.4vw);bottom:0;
    white-space:nowrap;font-size:14px;color:#000;
  }
  .lead figcaption span{color:#aaa;margin-left:10px}
  @media(max-width:720px){
    .pair{margin-bottom:clamp(48px,13vw,90px)}
    .lead figcaption{position:static;margin-top:8px;font-size:12px;white-space:normal}
    .lead figcaption span{margin-left:6px}
    .pair[data-set="geumho"]{--lw:94%;--lm:4%;--sw:84%;--sm:10%;--st:7vw}
    .pair[data-set="dmc"]{--lw:88%;--lm:9%;--sw:78%;--sm:2%;--st:3vw}
    .pair[data-set="magok"]{--lw:97%;--lm:3%;--sw:80%;--sm:14%;--st:11vw}
    .pair[data-set="manhyeon"]{--lw:92%;--lm:6%;--sw:78%;--sm:4%;--st:6vw}
    .pair[data-set="yeomchang"]{--lw:95%;--lm:4%;--sw:86%;--sm:8%;--st:8vw}
  }

  footer{padding:0 clamp(16px,3vw,32px) 28px;font-size:12px;color:#aaa;display:flex;justify-content:space-between;gap:12px}
  footer a{color:#000}

  /* 라이트박스 — 사진을 누르면 그 현장의 전체 컷 */
  .lb{position:fixed;inset:0;z-index:100;background:#fff;overflow-y:auto;
      display:none;padding:74px clamp(16px,4vw,40px) 12vh}
  .lb.on{display:block}
  .lb-bar{position:fixed;top:20px;left:0;right:0;z-index:110;
          display:flex;justify-content:space-between;
          padding:0 clamp(16px,3vw,32px);font-size:14px}
  .lb-bar b{font-weight:700}
  .lb-bar b span{color:#aaa;margin-left:10px;font-weight:400}
  .lb-close{background:none;border:0;font:inherit;cursor:pointer;padding:0}
  /* 열 때 닫기 버튼으로 포커스를 옮기는데(키보드 사용자용), 마우스로 연 경우까지
     파란 기본 포커스 링이 뜨면 거슬린다. 키보드로 이동했을 때만 표시한다. */
  .lb-close:focus{outline:none}
  .lb-close:focus-visible{outline:1px solid #000;outline-offset:3px}
  .lb-imgs{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:clamp(10px,1.6vw,20px)}
  .lb-imgs img{width:100%;background:#ebebeb}
  @media(max-width:480px){
    .lb{padding-top:58px}
    .lb-bar{top:14px;font-size:12px}
  }
  body.locked{overflow:hidden}
</style>
</head>
<body>

<a class="brand" href="./">클못<small>KEULMOT</small></a>
<nav class="nav"><a href="contact.html">문의</a></nav>

<main>
  <section class="pair" data-set="geumho">
    <figure class="lead">
      <img src="assets/geumho/09.jpg" alt="금호래미안하이리버 시공 사진" loading="lazy">
      <figcaption>금호래미안하이리버<span>2025</span></figcaption>
    </figure>
    <figure class="sub">
      <img src="assets/geumho/06.jpg" alt="금호래미안하이리버 시공 사진" loading="lazy">
    </figure>
  </section>
  <section class="pair" data-set="dmc">
    <figure class="lead">
      <img src="assets/dmc/04.jpg" alt="DMC래미안e편한세상 시공 사진" loading="lazy">
      <figcaption>DMC래미안e편한세상<span>2025</span></figcaption>
    </figure>
    <figure class="sub">
      <img src="assets/dmc/06.jpg" alt="DMC래미안e편한세상 시공 사진" loading="lazy">
    </figure>
  </section>
  <section class="pair" data-set="magok">
    <figure class="lead">
      <img src="assets/magok/06.jpg" alt="마곡 힐스테이트 시공 사진" loading="lazy">
      <figcaption>마곡 힐스테이트<span>2025</span></figcaption>
    </figure>
    <figure class="sub">
      <img src="assets/magok/14.jpg" alt="마곡 힐스테이트 시공 사진" loading="lazy">
    </figure>
  </section>
  <section class="pair" data-set="manhyeon">
    <figure class="lead">
      <img src="assets/manhyeon/06.jpg" alt="만현마을5단지 아이파크 시공 사진" loading="lazy">
      <figcaption>만현마을5단지 아이파크<span>2025</span></figcaption>
    </figure>
    <figure class="sub">
      <img src="assets/manhyeon/11.jpg" alt="만현마을5단지 아이파크 시공 사진" loading="lazy">
    </figure>
  </section>
  <section class="pair" data-set="yeomchang">
    <figure class="lead">
      <img src="assets/yeomchang/05.jpg" alt="염창월드메르디앙 시공 사진" loading="lazy">
      <figcaption>염창월드메르디앙<span>2025</span></figcaption>
    </figure>
    <figure class="sub">
      <img src="assets/yeomchang/03.jpg" alt="염창월드메르디앙 시공 사진" loading="lazy">
    </figure>
  </section>
</main>

<footer>
  <span>클못 KEULMOT — 대표 김태연</span>
  <a href="contact.html">문의</a>
  <span>© 2026 KEULMOT</span>
</footer>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="시공 사례 사진">
  <div class="lb-bar">
    <b id="lb-title"></b>
    <button class="lb-close" id="lb-close" aria-label="닫기">닫기</button>
  </div>
  <div class="lb-imgs" id="lb-imgs"></div>
</div>

<script>
  var SETS = {
    geumho:{name:"금호래미안하이리버",year:"2025",imgs:["01.jpg","02.jpg","03.jpg","04.jpg","05.jpg","06.jpg","07.jpg","08.jpg","09.jpg","10.jpg","11.jpg","12.jpg"]},
    dmc:{name:"DMC래미안e편한세상",year:"2025",imgs:["01.jpg","02.jpg","03.jpg","04.jpg","05.jpg","06.jpg","07.jpg","08.jpg","09.jpg"]},
    magok:{name:"마곡 힐스테이트",year:"2025",imgs:["01.jpg","02.jpg","03.jpg","04.jpg","05.jpg","06.jpg","07.jpg","08.jpg","09.jpg","10.jpg","11.jpg","12.jpg","13.jpg","14.jpg"]},
    manhyeon:{name:"만현마을5단지 아이파크",year:"2025",imgs:["01.jpg","02.jpg","03.jpg","04.jpg","05.jpg","06.jpg","07.jpg","08.jpg","09.jpg","10.jpg","11.jpg","12.jpg","13.jpg"]},
    yeomchang:{name:"염창월드메르디앙",year:"2025",imgs:["01.jpg","02.jpg","03.jpg","04.jpg","05.jpg","06.jpg","07.jpg"]}
  };

  var lb = document.getElementById('lb');
  var lbImgs = document.getElementById('lb-imgs');
  var lbTitle = document.getElementById('lb-title');
  var lastFocus = null;

  function open(slug){
    var s = SETS[slug];
    if(!s) return;
    lastFocus = document.activeElement;
    lbTitle.innerHTML = s.name + '<span>' + s.year + '</span>';
    // 열 때 만든다. 55장을 처음부터 불러오지 않기 위해서.
    lbImgs.innerHTML = s.imgs.map(function(f){
      return '<img src="assets/' + slug + '/' + f + '" alt="' + s.name + ' 시공 사진" loading="lazy">';
    }).join('');
    lb.classList.add('on');
    document.body.classList.add('locked');
    lb.scrollTop = 0;
    document.getElementById('lb-close').focus();
  }

  function close(){
    lb.classList.remove('on');
    document.body.classList.remove('locked');
    lbImgs.innerHTML = '';
    if(lastFocus) lastFocus.focus();
  }

  document.querySelectorAll('.pair').forEach(function(el){
    el.addEventListener('click', function(){ open(el.dataset.set); });
  });
  document.getElementById('lb-close').addEventListener('click', close);
  // 사진이 아닌 여백을 누르면 닫힌다.
  lb.addEventListener('click', function(e){ if(e.target === lb) close(); });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && lb.classList.contains('on')) close();
  });
</script>

</body>
</html>
